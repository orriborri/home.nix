# Declarative repo manifest -- consumed by both local home-manager activation
# and the KiroCrew EC2 launcher. Single source of truth for all hosts.
#
# Fields:
#   remote  (required) — Git SSH or HTTPS URL
#   path    (required) — clone destination relative to $HOME
#   shallow (optional, default true) — use --depth=1 if true
#   revision (optional) — full immutable commit SHA; supported by headless sync
#                         and the workstation managed-skills service
#   targets (optional, default ["workstation", "headless"]) — which roles clone this repo
#   graph   (optional, default true) — index this repo in the Code Review Graph.
#           Set false for non-code repos (skills, docs, wikis).

[settings]
base_dir = "code/readpeak"

# ─── ReadPeak (core) ───────────────────────────────────────────────

[[repos]]
remote = "git@gitlab.com:readpeak/mononode.git"
path = "code/readpeak/mononode"
shallow = false

[[repos]]
remote = "git@gitlab.com:readpeak/cdk.git"
path = "code/readpeak/cdk"
shallow = false

[[repos]]
remote = "git@gitlab.com:readpeak/nativeflow.git"
path = "code/readpeak/nativeflow"
shallow = false

[[repos]]
remote = "git@gitlab.com:readpeak/eks-workloads.git"
path = "code/readpeak/eks-workloads"
shallow = false

[[repos]]
remote = "git@gitlab.com:readpeak/cloudformation.git"
path = "code/readpeak/cloudformation"

[[repos]]
remote = "git@gitlab.com:readpeak/lambda.git"
path = "code/readpeak/lambda"

[[repos]]
remote = "git@gitlab.com:readpeak/integrator.git"
path = "code/readpeak/integrator"

[[repos]]
remote = "git@gitlab.com:readpeak/intelligence.git"
path = "code/readpeak/intelligence"

[[repos]]
remote = "git@gitlab.com:readpeak/ramp.git"
path = "code/readpeak/ramp"

[[repos]]
remote = "git@gitlab.com:readpeak/slackbots.git"
path = "code/readpeak/slackbots"

# ─── ReadPeak (additional) ────────────────────────────────────────

[[repos]]
remote = "git@gitlab.com:readpeak/spritsstudio.git"
path = "code/readpeak/SpritsStudio"
targets = ["workstation"]

[[repos]]
remote = "git@gitlab.com:readpeak/renovate-bot.git"
path = "code/readpeak/renovate-bot"

[[repos]]
remote = "git@gitlab.com:readpeak/gitlab-components.git"
path = "code/readpeak/gitlab-components"

# GitLab group wiki. Wiki repositories use the same clone/pull flow as code.
[[repos]]
remote = "git@gitlab.com:readpeak.wiki.git"
path = "code/readpeak/wiki"

[[repos]]
remote = "git@github.com:readpeak/Prebid.js.git"
path = "code/readpeak/Prebid.js"

# ─── External ─────────────────────────────────────────────────────

[[repos]]
remote = "git@github.com:orriborri/pasta.git"
path = "code/pasta"

# ─── Agent skills ─────────────────────────────────────────────────

# Matt Pocock's engineering skills (agentskills.io format). The skill-sync
# service reconciles whole skill directories from this pinned checkout into
# the gateway skills directory. Not code — exclude it
# from the Code Review Graph.
[[repos]]
remote = "https://github.com/mattpocock/skills.git"
path = "code/mattpocock-skills"
targets = ["workstation", "headless"]
revision = "3cca18b368ae95cdbdebbff572ccafa662551015"
graph = false
