# sops encryption configuration
# The age public key corresponds to the private key stored in 1Password
# (item: "kirocrew-age"). The private key lives at
#   /var/lib/sops-nix/key.txt        on the EC2 host (system sops, nixos/kirocrew-sops.nix)
#   ~/.config/sops/age/keys.txt      for orre's Home Manager profile (sops.nix)
# both bootstrapped via `op read`.
keys:
  - &kirocrew age1rpj9d9n73j57hq7pxmjs4raqlrvzqtm8wzcxtzvd9045jppuq3vqhe3px2

creation_rules:
  - path_regex: secrets/secrets\.yaml$
    key_groups:
      - age:
          - *kirocrew
